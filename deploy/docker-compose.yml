services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nextay
      MYSQL_USER: nextay
      MYSQL_PASSWORD: nextay
      MYSQL_ROOT_PASSWORD: nextay
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: